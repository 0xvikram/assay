<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <!-- Procedural marble: a cloudy base and thin navy veins. No photograph, no licence, tiles seamlessly. -->
  <defs>
    <filter id="clouds" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="4" seed="11" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.043  0 0 0 0 0.102  0 0 0 0 0.361  0.42 0 0 0 -0.16"/>
    </filter>
    <filter id="veins" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.0032 0.0095" numOctaves="5" seed="4" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.043  0 0 0 0 0.102  0 0 0 0 0.361  1 0 0 0 0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.42 0.14 0.03 0 0 0 0 0 0"/></feComponentTransfer>
      <feGaussianBlur stdDeviation="0.45"/>
    </filter>
    <filter id="fine" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.008 0.02" numOctaves="3" seed="21" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.043  0 0 0 0 0.102  0 0 0 0 0.361  1 0 0 0 0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.16 0.03 0 0 0 0 0 0 0"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="640" height="640" fill="#f3f6fb"/>
  <rect width="640" height="640" filter="url(#clouds)"/>
  <rect width="640" height="640" filter="url(#fine)"/>
  <rect width="640" height="640" filter="url(#veins)" opacity="0.6"/>
</svg>
