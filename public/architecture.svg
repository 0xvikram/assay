<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 640" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0F2226"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A9772A"/></marker>
  </defs>
  <rect width="1300" height="640" fill="#EFEFEA"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#0F2226">Assay — one engine, two doors, one ledger</text>
  <text x="24" y="54" fill="#0F2226" opacity=".7">brass = money moves · ink = data moves · dashed = verify / settle</text>

  <!-- paying agent -->
  <rect x="24" y="90" width="210" height="150" rx="8" fill="#fff" stroke="#0F2226" stroke-width="1.5"/>
  <text x="40" y="114" font-weight="700" fill="#0F2226">Paying agent</text>
  <text x="40" y="136" fill="#0F2226">mandate.json</text>
  <text x="40" y="152" fill="#0F2226" opacity=".7">per-payment cap · run cap</text>
  <text x="40" y="168" fill="#0F2226" opacity=".7">allowed verdicts · step-up</text>
  <text x="40" y="196" fill="#0F2226">x402 client</text>
  <text x="40" y="212" fill="#0F2226" opacity=".7">signs only, never submits</text>

  <!-- assay -->
  <rect x="320" y="76" width="370" height="304" rx="8" fill="#fff" stroke="#0F2226" stroke-width="1.5"/>
  <text x="336" y="100" font-weight="700" fill="#0F2226">Assay · Next.js 16 on Vercel</text>
  <rect x="336" y="116" width="160" height="54" rx="6" fill="#EFEFEA" stroke="#0F2226"/>
  <text x="346" y="136" fill="#0F2226">REST /api/v1/*</text>
  <text x="346" y="152" fill="#0F2226" opacity=".7">withX402 per route</text>
  <rect x="514" y="116" width="160" height="54" rx="6" fill="#EFEFEA" stroke="#0F2226"/>
  <text x="524" y="136" fill="#0F2226">MCP /api/mcp</text>
  <text x="524" y="152" fill="#0F2226" opacity=".7">@x402/mcp paid tools</text>
  <path d="M416 170V196M594 170V196" fill="none" stroke="#0F2226" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="336" y="196" width="338" height="88" rx="6" fill="#EFEFEA" stroke="#0F2226"/>
  <text x="346" y="216" fill="#0F2226" font-weight="700">engine — pure TS, no framework</text>
  <text x="346" y="234" fill="#0F2226" font-size="11">signals → 11 detectors → verdict + next steps</text>
  <text x="346" y="250" fill="#0F2226" font-size="11">resolve endpoint · corroborate across chains</text>
  <text x="346" y="268" fill="#0F2226" font-size="11" opacity=".7">no pinned deployment + block → no answer</text>
  <rect x="336" y="304" width="338" height="56" rx="6" fill="#EFEFEA" stroke="#0F2226"/>
  <text x="346" y="324" fill="#0F2226" font-size="11">/ console · /architecture · /escalate</text>
  <text x="346" y="340" fill="#0F2226" font-size="11" opacity=".7">reads the action trail from the mirror node</text>

  <!-- the graph -->
  <rect x="800" y="76" width="476" height="112" rx="8" fill="#fff" stroke="#0F2226" stroke-width="1.5"/>
  <text x="816" y="100" font-weight="700" fill="#0F2226">The Graph · decentralised network</text>
  <text x="816" y="122" fill="#0F2226">Agent0 ERC-8004 subgraphs — one schema</text>
  <text x="816" y="140" fill="#0F2226" opacity=".7">ethereum · base · bsc · polygon · base-sepolia · bsc-chapel</text>
  <text x="816" y="158" fill="#0F2226" opacity=".7">adding a chain = one row in registry/chains.json</text>
  <text x="816" y="176" fill="#0F2226" opacity=".7">feedback + registration files read via file/ipfs</text>

  <!-- hedera -->
  <rect x="800" y="216" width="476" height="164" rx="8" fill="#fff" stroke="#A9772A" stroke-width="1.5"/>
  <text x="816" y="240" font-weight="700" fill="#A9772A">Hedera testnet</text>
  <rect x="816" y="254" width="200" height="52" rx="6" fill="#EFEFEA" stroke="#A9772A"/>
  <text x="826" y="274" fill="#0F2226">Blocky402 facilitator</text>
  <text x="826" y="290" fill="#0F2226" opacity=".7">/verify · /settle</text>
  <rect x="1060" y="254" width="200" height="52" rx="6" fill="#EFEFEA" stroke="#A9772A"/>
  <text x="1070" y="274" fill="#0F2226">HCS receipt topic</text>
  <text x="1070" y="290" fill="#0F2226" opacity=".7">the only store</text>
  <path d="M1016 280H1060" fill="none" stroke="#A9772A" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="1018" y="272" fill="#A9772A" font-size="9.5">receipt</text>
  <path d="M1160 306V334" fill="none" stroke="#A9772A" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="816" y="350" fill="#0F2226">mirror node — free, unauthenticated read-back</text>
  <text x="816" y="368" fill="#0F2226" opacity=".7">receipts · mandate changes · approvals</text>

  <!-- base sepolia -->
  <rect x="24" y="430" width="470" height="150" rx="8" fill="#fff" stroke="#0F2226" stroke-width="1.5"/>
  <text x="40" y="454" font-weight="700" fill="#0F2226">Base Sepolia · ERC-8004 reference registries</text>
  <text x="40" y="476" fill="#0F2226" font-size="11">Identity   0x8004A818…BD9e — Assay registered as an agent</text>
  <text x="40" y="492" fill="#0F2226" font-size="11">Reputation 0x8004B663…8713 — giveFeedback(…, ipfs://cid, hash)</text>
  <text x="40" y="518" fill="#0F2226" font-weight="700">the receipt</text>
  <text x="40" y="536" fill="#0F2226" font-size="11" opacity=".8">proofOfPayment { chainId: 296, txHash: Hedera settlement }</text>
  <text x="40" y="552" fill="#0F2226" font-size="11" opacity=".8">reviews are free to write — this one cost what the work cost</text>

  <!-- ipfs -->
  <rect x="540" y="430" width="200" height="72" rx="8" fill="#fff" stroke="#0F2226" stroke-width="1.5"/>
  <text x="556" y="454" font-weight="700" fill="#0F2226">IPFS — The Graph's node</text>
  <text x="556" y="472" fill="#0F2226" font-size="11" opacity=".7">the one the indexer reads</text>
  <text x="556" y="488" fill="#0F2226" font-size="11" opacity=".7">pin · read back · reference</text>

  <!-- next -->
  <rect x="800" y="430" width="476" height="150" rx="8" fill="none" stroke="#0F2226" stroke-dasharray="5 4"/>
  <text x="816" y="454" font-weight="700" fill="#0F2226" opacity=".8">next</text>
  <text x="816" y="476" fill="#0F2226" font-size="11" opacity=".8">Arc Nanopayments — second rail, /api/arc/v1/*</text>
  <text x="816" y="494" fill="#0F2226" font-size="11" opacity=".8">Privy treasury — policy + key quorum, the mandate's other half</text>
  <text x="816" y="512" fill="#0F2226" font-size="11" opacity=".8">World Selfie Check — step-up to raise the cap</text>
  <text x="816" y="530" fill="#0F2226" font-size="11" opacity=".8">Bazantic gateway over /api/openapi · Uniswap quote</text>

  <!-- flows -->
  <path d="M234 143H320" fill="none" stroke="#A9772A" stroke-width="2" marker-end="url(#b)"/>
  <text x="242" y="134" fill="#A9772A" font-size="9.5">402 · pay · 200</text>
  <path d="M690 132H800" fill="none" stroke="#0F2226" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="698" y="124" fill="#0F2226" font-size="10">GraphQL + _meta</text>
  <path d="M690 240C750 240 750 280 816 280" fill="none" stroke="#A9772A" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#b)"/>
  <text x="700" y="252" fill="#A9772A" font-size="10">verify · settle</text>
  <path d="M129 240V430" fill="none" stroke="#A9772A" stroke-width="2" marker-end="url(#b)"/>
  <text x="138" y="340" fill="#A9772A" font-size="10">writes the receipt</text>
  <path d="M494 466H540" fill="none" stroke="#0F2226" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="498" y="458" fill="#0F2226" font-size="10">pins</text>
  <path d="M740 466C780 466 780 200 800 200" fill="none" stroke="#0F2226" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#a)"/>
  <text x="748" y="412" fill="#0F2226" font-size="10" opacity=".7">indexer fetches</text>
  <text x="748" y="424" fill="#0F2226" font-size="10" opacity=".7">file/ipfs</text>
</svg>
